<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">飞书 OKR 草稿工作流</title>
  <desc id="desc">上周期完成情况、本周期被艾特、上周期艾特他人和直属上级 OKR 汇聚成飞书 OKR 草稿，再分流到承接协作、写入艾特和保存未发布核验。</desc>
  <rect width="1200" height="675" fill="#FFFFFF"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" fill="#111111">
